name: Scribe
configFiles:
  Debug: Local.xcconfig
  Release: Local.xcconfig

options:
  bundleIdPrefix: com.machinascribe
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  ScribeCore:
    path: ScribeCore

targets:
  Scribe-iOS:
    type: application
    platform: iOS
    sources:
      - path: Scribe/Sources
      - path: Scribe/Resources/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
      - package: ScribeCore
        product: ScribeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.machinascribe.Scribe
        PRODUCT_NAME: Scribe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Scribe/Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Scribe
        CFBundleName: Scribe
        NSMicrophoneUsageDescription: >-
          Scribe records meetings so it can transcribe who said what. Recordings
          stay on this device and are deleted automatically; how long they are
          kept is up to you in Settings.
        NSSpeechRecognitionUsageDescription: >-
          Used only for the rough live preview shown while you record. Scribe
          requires on-device recognition, so despite the notice above, this
          audio is not sent to Apple. Declining only hides the preview.
        UIBackgroundModes: [audio]
        # Lets the app talk to a Supabase running on this Mac over plain HTTP
        # while the hosted project does not exist yet. This flag permits only
        # local and link-local addresses -- it does not allow cleartext to the
        # public internet. Safe to drop once you are on a https:// project.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}

  Scribe-macOS:
    type: application
    platform: macOS
    sources:
      - path: Scribe/Sources
      - path: Scribe/Resources/Assets.xcassets
    dependencies:
      - package: Supabase
        product: Supabase
      - package: ScribeCore
        product: ScribeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.machinascribe.Scribe
        PRODUCT_NAME: Scribe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: Scribe/Resources/Scribe.entitlements
    info:
      path: Scribe/Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: Scribe
        CFBundleName: Scribe
        NSMicrophoneUsageDescription: >-
          Scribe records meetings so it can transcribe who said what. Recordings
          stay on this device and are deleted automatically; how long they are
          kept is up to you in Settings.
        NSSpeechRecognitionUsageDescription: >-
          Used only for the rough live preview shown while you record. Scribe
          requires on-device recognition, so despite the notice above, this
          audio is not sent to Apple. Declining only hides the preview.
        LSMinimumSystemVersion: "14.0"
        # Same as the iOS target: reach the local Supabase over plain HTTP.
        # Permits local/link-local addresses only, not the public internet.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
