name: Scribe
options:
  bundleIdPrefix: com.machinascribe
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.0.0"
  ScribeCore:
    path: ScribeCore

targets:
  Scribe-iOS:
    type: application
    platform: iOS
    sources:
      - path: Scribe/Sources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: ScribeCore
        product: ScribeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.machinascribe.Scribe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    info:
      path: Scribe/Resources/Info-iOS.plist
      properties:
        CFBundleDisplayName: Scribe
        NSMicrophoneUsageDescription: >-
          Scribe records meetings so it can transcribe who said what. Audio is
          deleted as soon as the transcript comes back; it is never stored.
        UIBackgroundModes: [audio]
        UILaunchScreen: {}

  Scribe-macOS:
    type: application
    platform: macOS
    sources:
      - path: Scribe/Sources
    dependencies:
      - package: Supabase
        product: Supabase
      - package: ScribeCore
        product: ScribeCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.machinascribe.Scribe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_ENTITLEMENTS: Scribe/Resources/Scribe.entitlements
    info:
      path: Scribe/Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: Scribe
        NSMicrophoneUsageDescription: >-
          Scribe records meetings so it can transcribe who said what. Audio is
          deleted as soon as the transcript comes back; it is never stored.
        LSMinimumSystemVersion: "14.0"
